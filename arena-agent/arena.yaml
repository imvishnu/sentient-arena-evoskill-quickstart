# Sentient Arena — Challenge 1 (office-qa) agent.
# The model field is dev-only; the Arena forces MiniMax M2.7 server-side at eval.
name: "officeqa-evoskill-agent"
version: "0.1.0"
competition: "office-qa"

agent:
  type: "harness"
  harness_name: "goose"                          # the Arena's proven harness for office-qa
  model: "openrouter/minimax/minimax-m2.7"
  prompt_template_path: "prompts/officeqa_prompt.j2"
  skills_dir: "skills_consolidated/"             # <- submit.sh drops your EvoSkill-evolved skill here
  config:
    reasoning_effort: "medium"
    max_iterations: 60   # passing runs finish <40; caps cost of failure spirals (worst seen: $1.83 at ~100 iters)
  env:
    OPENROUTER_API_KEY: "${oc.env:OPENROUTER_API_KEY,''}"   # local-testing only; eval uses Arena's keys

environment: {}
